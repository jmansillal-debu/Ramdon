<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModaaaaaaaaaUrban21 | Catálogo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="cabecera">
    <nav class="barra-navegacion">
      <div class="logotipo">
        <img src="image/LogoMODaURban.png" alt="Logo ModaUrban21" class="imagen-logotipo">
        <span>ModaUrban211111</span>
      </div>

      <ul class="enlaces-navegacion">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="catalogo.html" class="enlace-activo">Catálogo</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
      </ul>

      <div class="acciones-usuario">
        <button id="boton-carrito" class="boton-icono">🛒 <span id="contador-carrito">0</span></button>
        <a href="login.html" id="boton-login-nav" class="boton boton-secundario">Iniciar Sesión</a>
        <span id="saludo-usuario" class="saludo-usuario"></span>
        <button id="boton-cerrar-sesion" class="boton-salir oculto">Salir</button>
      </div>
    </nav>
  </header>

  <main class="contenedor-pagina">
    <section class="seccion-catalogo">
      <h2>Catálogo de Productos</h2>

      <div class="caja-busqueda">
        <input type="text" id="input-busqueda" placeholder="Buscar por nombre, tipo o prenda...">
      </div>

      <div class="filtros-genero">
        <button class="boton-genero activo" data-genero="todos">Todos</button>
        <button class="boton-genero" data-genero="hombre">Hombre</button>
        <button class="boton-genero" data-genero="mujer">Mujer</button>
        <button class="boton-genero" data-genero="unisex">Unisex</button>
      </div>

      <div class="filtros">
        <button class="boton-filtro activo" data-categoria="todos">Todas las Prendas</button>
        <button class="boton-filtro" data-categoria="poleras">Poleras</button>
        <button class="boton-filtro" data-categoria="pantalones">Pantalones</button>
        <button class="boton-filtro" data-categoria="casacas">Casacas</button>
        <button class="boton-filtro" data-categoria="polos">Polos</button>
        <button class="boton-filtro" data-categoria="zapatillas">Zapatillas</button>
        <button class="boton-filtro" data-categoria="accesorios">Accesorios</button>
      </div>

      <div id="rejilla-catalogo" class="rejilla-productos"></div>
    </section>
  </main>

  <div id="modal-carrito" class="modal">
    <div class="contenido-modal-carrito">
      <span class="cerrar-modal" id="cerrar-carrito">&times;</span>
      <h2>Tu Carrito de Compras</h2>
      <div id="elementos-carrito" class="elementos-carrito"></div>
      <div class="pie-carrito">
        <p>Total: S/ <span id="total-carrito">0.00</span></p>
        <button id="boton-checkout" class="boton boton-primario boton-bloque">Finalizar Compra</button>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 ModaUrban21. Todos los derechos reservados.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
